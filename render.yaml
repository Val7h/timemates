databases:
  - name: timemates-db
    databaseName: timemates
    user: timemates
    plan: free

services:
  - type: web
    name: timemates
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: timemates-db
          property: connectionString
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: valthguime@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: BASE_URL
        value: https://timemates.onrender.com
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_ANALYTICS_ID
        value: G-2BSK5VVYFD
      - key: VAPID_EMAIL
        value: valthguime@gmail.com
      - key: SEED_KEY
        value: "tm-seed-ufcg-2024-xK9p"
