<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TimeMates Chat - Exemplo</title>
  <link rel="stylesheet" href="./chat.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 20px;
    }

    .sidebar {
      height: fit-content;
      position: sticky;
      top: 20px;
    }

    .chat-area {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid #eee;
      padding-bottom: 15px;
    }

    .chat-header h1 {
      font-size: 24px;
      color: #333;
    }

    .messages {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
      max-height: 500px;
      overflow-y: auto;
      padding: 10px 0;
    }

    .message {
      padding: 12px;
      background: #f9f9f9;
      border-radius: 8px;
      border-left: 4px solid #667eea;
    }

    .message-author {
      font-weight: 600;
      color: #333;
      margin-bottom: 4px;
      font-size: 13px;
    }

    .message-content {
      color: #666;
      font-size: 14px;
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .message-time {
      font-size: 12px;
      color: #999;
    }

    .input-area {
      display: flex;
      gap: 10px;
    }

    .input-area input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-area input:focus {
      border-color: #667eea;
    }

    .input-area button {
      padding: 10px 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .input-area button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .reactions-demo {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
    }

    .reactions-demo h3 {
      font-size: 13px;
      color: #666;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .reaction-buttons {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .reaction-btn {
      padding: 6px 10px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
      cursor: pointer;
      font-size: 18px;
      transition: all 0.2s;
    }

    .reaction-btn:hover {
      border-color: #667eea;
      background: #f0f4ff;
    }

    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
      }

      .chat-area {
        padding: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Sidebar com Online Users Widget -->
    <aside class="sidebar">
      <div id="online-users-widget" data-timemates-chat data-room-id="room-123"></div>
    </aside>

    <!-- Chat Area -->
    <main class="chat-area" data-timemates-chat data-room-id="room-123">
      <div class="chat-header">
        <h1>Sala de Chat</h1>
        <span style="font-size: 12px; color: #999;">ID: room-123</span>
      </div>

      <div class="messages">
        <div class="message" data-message-id="msg-1">
          <div class="message-author">João Silva</div>
          <div class="message-content">Olá pessoal! Como estão?</div>
          <div class="message-time">14:30</div>
        </div>

        <div class="message" data-message-id="msg-2">
          <div class="message-author">Maria Santos</div>
          <div class="message-content">Tudo bem! Que bacana esse novo sistema</div>
          <div class="message-time">14:31</div>
        </div>

        <div class="message" data-message-id="msg-3">
          <div class="message-author">Pedro Oliveira</div>
          <div class="message-content">Concordo! As reações em tempo real são muito legais</div>
          <div class="message-time">14:32</div>
          <div class="message-reactions" style="display: none;">
            <div class="message-reaction" data-emoji="👍" data-users="[&quot;João Silva&quot;]">
              <span class="reaction-emoji">👍</span>
              <span class="reaction-count">1</span>
            </div>
            <div class="message-reaction" data-emoji="🎉" data-users="[&quot;Maria Santos&quot;, &quot;Pedro Oliveira&quot;]">
              <span class="reaction-emoji">🎉</span>
              <span class="reaction-count">2</span>
            </div>
          </div>

          <!-- Demo de reações -->
          <div class="reactions-demo">
            <h3>Clique para simular reações:</h3>
            <div class="reaction-buttons">
              <button class="reaction-btn" data-emoji="👍">👍</button>
              <button class="reaction-btn" data-emoji="❤️">❤️</button>
              <button class="reaction-btn" data-emoji="😂">😂</button>
              <button class="reaction-btn" data-emoji="🎉">🎉</button>
              <button class="reaction-btn" data-emoji="🔥">🔥</button>
              <button class="reaction-btn" data-emoji="💯">💯</button>
            </div>
          </div>
        </div>
      </div>

      <div class="input-area">
        <input type="text" placeholder="Digite sua mensagem..." id="message-input" />
        <button id="send-btn">Enviar</button>
      </div>
    </main>
  </div>

  <script src="./chat.js"></script>
  <script>
    // Demo - Simular entrada de usuários
    document.addEventListener('DOMContentLoaded', () => {
      // Inicializar TimeMates Chat
      const chat = window.TimeMatesChat.init({
        roomId: 'room-123',
        containerId: 'online-users-widget'
      });

      // Demo: Simular entrada de usuário a cada 5 segundos
      const demoUsers = [
        'Ana Costa',
        'Roberto Silva',
        'Fernanda Lima',
        'Carlos Mendes'
      ];
      let userIndex = 0;

      setInterval(() => {
        if (chat.userJoinedNotifier && Math.random() > 0.7) {
          const userName = demoUsers[userIndex % demoUsers.length];
          // Simular evento user_joined
          const event = new Event('message');
          Object.defineProperty(event, 'data', {
            value: JSON.stringify({
              type: 'user_joined',
              data: { userName }
            })
          });

          if (chat.userJoinedNotifier.ws) {
            chat.userJoinedNotifier.ws.dispatchEvent(event);
          } else {
            // Mostrar diretamente sem WebSocket
            chat.userJoinedNotifier.showJoinNotification({ userName });
          }

          userIndex++;
        }
      }, 5000);

      // Demo: Botões de reação
      document.querySelectorAll('.reaction-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const emoji = btn.getAttribute('data-emoji');
          const messageId = 'msg-3';

          // Simular evento reaction_added
          const event = new Event('message');
          Object.defineProperty(event, 'data', {
            value: JSON.stringify({
              type: 'reaction_added',
              data: {
                messageId,
                emoji,
                userId: 'user-' + Math.random(),
                userName: 'Você'
              }
            })
          });

          if (chat.reactionHandler && chat.reactionHandler.ws) {
            chat.reactionHandler.ws.dispatchEvent(event);
          } else {
            // Chamar diretamente
            chart.reactionHandler.handleReactionAdded({
              messageId,
              emoji,
              userId: 'user-' + Math.random(),
              userName: 'Você'
            });
          }
        });
      });

      // Demo: Enviar mensagem
      document.getElementById('send-btn').addEventListener('click', () => {
        const input = document.getElementById('message-input');
        if (input.value.trim()) {
          alert('Mensagem enviada: ' + input.value);
          input.value = '';
        }
      });

      input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          document.getElementById('send-btn').click();
        }
      });
    });
  </script>
</body>
</html>
