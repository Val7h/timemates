<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <filter id="g" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="warm" cx="50%" cy="100%" r="100%">
      <stop offset="0%" stop-color="#d4a853" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#ff7e5f" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amberT" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8c074"/>
      <stop offset="100%" stop-color="#d4a853"/>
    </linearGradient>
  </defs>
  <rect width="180" height="180" rx="36" fill="#0a0a0a"/>
  <rect width="180" height="180" rx="36" fill="url(#warm)"/>
  <!-- polaroid corner accents -->
  <g opacity="0.4" stroke="#d4a853" stroke-width="2" fill="none">
    <path d="M 16 16 L 16 30"/>
    <path d="M 16 16 L 30 16"/>
    <path d="M 164 164 L 164 150"/>
    <path d="M 164 164 L 150 164"/>
  </g>
  <text x="90" y="130" font-family="'Crimson Text', Georgia, serif" font-style="italic" font-size="130" fill="url(#amberT)" text-anchor="middle" filter="url(#g)">T</text>
</svg>
