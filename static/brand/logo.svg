<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="sunset" cx="50%" cy="100%" r="120%">
      <stop offset="0%" stop-color="#d4a853" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#ff7e5f" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amberText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8c074"/>
      <stop offset="100%" stop-color="#d4a853"/>
    </linearGradient>
  </defs>
  <rect width="280" height="80" fill="#0a0a0a"/>
  <rect width="280" height="80" fill="url(#sunset)"/>
  <!-- polaroid corner accent (top-left) -->
  <g opacity="0.35" stroke="#d4a853" stroke-width="1" fill="none">
    <path d="M 6 6 L 6 16"/>
    <path d="M 6 6 L 16 6"/>
  </g>
  <!-- polaroid corner accent (bottom-right) -->
  <g opacity="0.35" stroke="#d4a853" stroke-width="1" fill="none">
    <path d="M 274 74 L 274 64"/>
    <path d="M 274 74 L 264 74"/>
  </g>
  <text x="18" y="52" font-family="'Crimson Text', Georgia, serif" font-style="italic" font-size="36" fill="url(#amberText)" filter="url(#glow)">TimeMates</text>
  <!-- subtle moon/sun dot -->
  <circle cx="258" cy="26" r="3" fill="#d4a853" opacity="0.7" filter="url(#glow)"/>
  <circle cx="258" cy="26" r="6" fill="none" stroke="#d4a853" stroke-width="0.5" opacity="0.25"/>
</svg>
